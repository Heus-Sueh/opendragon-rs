[workspace]
resolver = "2"
members = [
    "crates/opendragon-core",
    "crates/opendragon-hid",
    "crates/opendragon-protocol",
    "crates/opendragon-devices",
    "apps/opendragon-cli",
    "tools/hid-diff",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["OpenDragon Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/GrbavaCigla/opendragon"
homepage = "https://github.com/GrbavaCigla/opendragon"
readme = "README.md"
keywords = ["redragon", "hid", "keyboard", "mouse", "rgb"]
categories = ["hardware-support", "command-line-utilities"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
hidapi = "2.6"
